<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs>
    <style>
      .bg { fill: #111111; }
      .panel { fill: #1c1c1c; stroke: #3a3a3a; stroke-width: 2; rx: 18; }
      .box { fill: #262626; stroke-width: 2; rx: 14; }
      .title { fill: #f5f5f5; font: 700 42px Arial, sans-serif; }
      .subtitle { fill: #aaaaaa; font: 400 20px Arial, sans-serif; }
      .section { fill: #f5f5f5; font: 700 24px Arial, sans-serif; }
      .label { fill: #f5f5f5; font: 700 19px Arial, sans-serif; }
      .small { fill: #c8c8c8; font: 400 15px Arial, sans-serif; }
      .tiny { fill: #aaaaaa; font: 400 13px Arial, sans-serif; }
      .gold { stroke: #d4af37; }
      .blue { stroke: #6ca8ff; }
      .green { stroke: #55d18a; }
      .orange { stroke: #ffa24a; }
      .red { stroke: #e65b5b; }
      .purple { stroke: #b38cff; }
      .line { stroke: #d4af37; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .lineBlue { stroke: #6ca8ff; stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
      .lineGreen { stroke: #55d18a; stroke-width: 3; fill: none; marker-end: url(#arrowGreen); }
      .lineMuted { stroke: #666666; stroke-width: 2; fill: none; marker-end: url(#arrowMuted); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#d4af37"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#6ca8ff"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#55d18a"/>
    </marker>
    <marker id="arrowMuted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#666666"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1200"/>
  <text class="title" x="70" y="70">ClearTone System Architecture</text>
  <text class="subtitle" x="72" y="106">Flutter Android hearing-assistance app with native Oboe DSP, environment detection, hearing profiles, and speech assist</text>
  <rect x="70" y="128" width="1660" height="4" fill="#d4af37"/>

  <!-- User and app shell -->
  <rect class="panel" x="70" y="170" width="1660" height="170"/>
  <text class="section" x="95" y="210">Flutter Application Layer</text>
  <rect class="box blue" x="110" y="235" width="205" height="70"/>
  <text class="label" x="132" y="263">Profile Selection</text>
  <text class="small" x="132" y="286">create / select / delete</text>
  <rect class="box blue" x="365" y="235" width="220" height="70"/>
  <text class="label" x="402" y="263">HomeWrapper</text>
  <text class="small" x="397" y="286">IndexedStack tabs</text>
  <rect class="box blue" x="635" y="235" width="185" height="70"/>
  <text class="label" x="681" y="263">Home</text>
  <text class="small" x="660" y="286">quick controls</text>
  <rect class="box green" x="870" y="235" width="205" height="70"/>
  <text class="label" x="902" y="263">Amplify</text>
  <text class="small" x="898" y="286">RT + record + modes</text>
  <rect class="box purple" x="1125" y="235" width="190" height="70"/>
  <text class="label" x="1167" y="263">Tools</text>
  <text class="small" x="1158" y="286">STT / TTS assist</text>
  <rect class="box orange" x="1365" y="235" width="190" height="70"/>
  <text class="label" x="1412" y="263">Profile</text>
  <text class="small" x="1390" y="286">history + results</text>

  <path class="lineMuted" d="M315 270 H365"/>
  <path class="lineMuted" d="M585 270 H635"/>
  <path class="lineMuted" d="M820 270 H870"/>
  <path class="lineMuted" d="M1075 270 H1125"/>
  <path class="lineMuted" d="M1315 270 H1365"/>

  <!-- Shared state and data -->
  <rect class="panel" x="70" y="375" width="520" height="270"/>
  <text class="section" x="95" y="415">Local Data and Shared State</text>
  <rect class="box gold" x="110" y="445" width="205" height="70"/>
  <text class="label" x="145" y="473">Profile</text>
  <text class="small" x="132" y="496">name + testResults</text>
  <rect class="box gold" x="345" y="445" width="205" height="70"/>
  <text class="label" x="380" y="473">Test Result</text>
  <text class="small" x="369" y="496">ear thresholds by Hz</text>
  <rect class="box gold" x="110" y="545" width="205" height="70"/>
  <text class="label" x="141" y="573">ProfileStorage</text>
  <text class="small" x="135" y="596">SharedPreferences JSON</text>
  <rect class="box blue" x="345" y="545" width="205" height="70"/>
  <text class="label" x="372" y="573">Amplification</text>
  <text class="small" x="378" y="596">Status + Controller</text>
  <path class="lineMuted" d="M212 515 V545"/>
  <path class="lineMuted" d="M315 480 H345"/>

  <!-- Hearing test -->
  <rect class="panel" x="630" y="375" width="520" height="270"/>
  <text class="section" x="655" y="415">Hearing Test Workflow</text>
  <rect class="box blue" x="670" y="445" width="180" height="70"/>
  <text class="label" x="713" y="473">ScreenTest</text>
  <text class="small" x="694" y="496">Hughson-Westlake</text>
  <rect class="box orange" x="910" y="445" width="180" height="70"/>
  <text class="label" x="944" y="473">Kotlin Audio</text>
  <text class="small" x="938" y="496">AudioTrack + MediaPlayer</text>
  <rect class="box gold" x="790" y="545" width="180" height="70"/>
  <text class="label" x="824" y="573">ResultsScreen</text>
  <text class="small" x="825" y="596">audiogram chart</text>
  <path class="line" d="M850 480 H910"/>
  <path class="line" d="M1000 515 C1000 555 970 580 970 580"/>

  <!-- Speech -->
  <rect class="panel" x="1190" y="375" width="540" height="270"/>
  <text class="section" x="1215" y="415">Speech Assist</text>
  <rect class="box purple" x="1230" y="445" width="200" height="70"/>
  <text class="label" x="1272" y="473">Offline Mode</text>
  <text class="small" x="1255" y="496">speech_to_text + flutter_tts</text>
  <rect class="box purple" x="1485" y="445" width="200" height="70"/>
  <text class="label" x="1525" y="473">Online Mode</text>
  <text class="small" x="1512" y="496">Google STT/TTS APIs</text>
  <rect class="box orange" x="1355" y="545" width="200" height="70"/>
  <text class="label" x="1390" y="573">Speaker Router</text>
  <text class="small" x="1382" y="596">phone speaker channel</text>
  <path class="lineMuted" d="M1430 480 H1485"/>
  <path class="lineMuted" d="M1330 515 C1330 550 1370 565 1370 565"/>
  <path class="lineMuted" d="M1585 515 C1585 550 1535 565 1535 565"/>

  <!-- Realtime pipeline -->
  <rect class="panel" x="70" y="685" width="1660" height="385"/>
  <text class="section" x="95" y="725">Real-Time Amplification and Environment Detection</text>

  <rect class="box blue" x="110" y="765" width="190" height="75"/>
  <text class="label" x="150" y="793">Flutter UI</text>
  <text class="small" x="135" y="816">start / stop / mode / gains</text>

  <rect class="box orange" x="355" y="765" width="205" height="75"/>
  <text class="label" x="395" y="793">MethodChannel</text>
  <text class="small" x="382" y="816">AudioManager + SCO</text>

  <rect class="box green" x="615" y="765" width="205" height="75"/>
  <text class="label" x="662" y="793">AudioEngineFFI</text>
  <text class="small" x="651" y="816">typed native calls</text>

  <rect class="box green" x="875" y="765" width="205" height="75"/>
  <text class="label" x="925" y="793">OboeEngine</text>
  <text class="small" x="905" y="816">input + output streams</text>

  <rect class="box green" x="1135" y="765" width="235" height="75"/>
  <text class="label" x="1170" y="793">RealtimeProcessor</text>
  <text class="small" x="1163" y="816">crossover + compression</text>

  <rect class="box red" x="1430" y="765" width="205" height="75"/>
  <text class="label" x="1475" y="793">Audio Output</text>
  <text class="small" x="1456" y="816">processed headphone signal</text>

  <path class="lineGreen" d="M300 803 H355"/>
  <path class="lineGreen" d="M560 803 H615"/>
  <path class="lineGreen" d="M820 803 H875"/>
  <path class="lineGreen" d="M1080 803 H1135"/>
  <path class="lineGreen" d="M1370 803 H1430"/>

  <rect class="box gold" x="1135" y="885" width="235" height="115"/>
  <text class="label" x="1174" y="915">DSP Details</text>
  <text class="small" x="1163" y="941">6 bands: &lt;500 to &gt;8k Hz</text>
  <text class="small" x="1163" y="964">Standard / Transit / Conversation</text>
  <text class="small" x="1163" y="987">profile makeup gain + limiter</text>

  <rect class="box blue" x="615" y="905" width="230" height="95"/>
  <text class="label" x="655" y="934">Raw Input Ring</text>
  <text class="small" x="650" y="958">pre-DSP mic frames</text>
  <text class="small" x="645" y="981">drained from Dart detector</text>

  <rect class="box purple" x="305" y="905" width="245" height="95"/>
  <text class="label" x="342" y="934">EnvironmentDetector</text>
  <text class="small" x="333" y="958">resample + mel spectrogram</text>
  <text class="small" x="357" y="981">TFLite CNN inference</text>

  <rect class="box purple" x="110" y="905" width="145" height="95"/>
  <text class="label" x="151" y="934">Modes</text>
  <text class="small" x="132" y="958">0 Standard</text>
  <text class="small" x="132" y="981">1 Transit / 2 Talk</text>

  <path class="lineBlue" d="M875 840 C855 890 820 920 845 950"/>
  <path class="lineBlue" d="M615 952 H550"/>
  <path class="lineBlue" d="M305 952 H255"/>
  <path class="lineBlue" d="M182 905 C182 850 155 820 110 803"/>

  <rect class="box orange" x="1430" y="895" width="205" height="105"/>
  <text class="label" x="1467" y="925">Offline WAV Path</text>
  <text class="small" x="1455" y="950">record package + files</text>
  <text class="small" x="1458" y="973">process_audio_file_ffi</text>
  <path class="lineMuted" d="M1430 947 H1370"/>

  <!-- Footer -->
  <text class="tiny" x="70" y="1145">Generated from current source architecture: Flutter UI, Dart FFI, Kotlin MethodChannel, C++ Oboe DSP, TFLite environment detection, SharedPreferences storage, and optional Google Cloud speech.</text>
</svg>
